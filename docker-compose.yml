version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: duh-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: duh
      POSTGRES_PASSWORD: duh
      POSTGRES_DB: duh
    ports:
      - "5432:5432"
    volumes:
      - duh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duh -d duh"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  duh_pgdata: